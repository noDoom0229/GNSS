# 数据集 20240301 —— 零基线
#   采集时间：2024-03-01 上午
#   采集地点：武汉大学测绘学院院楼楼顶
#   采集设备：OEM729 板卡
#   基线类型：零基线（两台接收机共用一副天线，真实基线为 0）
#
# 用法：GNSS_RTK.exe config\config_20240301.ini
# 数据文件不入库，需自行下载后放到 data\ 目录下。

# ---------- 数据来源 ----------
PosMode = 0

BasBinFile = data/20240301_base.log
RovBinFile = data/20240301_rove.log

BasIP = 8.148.22.229
BasPort = 7002
RovIP = 8.148.22.229
RovPort = 4002

# ---------- 输出 ----------
NMEAOutputFile = output/20240301.nmea
OutputFile = output/20240301.txt

# ---------- 解码结果输出（讲义要求：与 RINEX 对比检查） ----------
# DecodeOutput: 0 = 不输出，1 = 输出两站解码后的观测值与星历
DecodeOutput = 1
BasObsFile = output/20240301_base_obs.txt
RovObsFile = output/20240301_rove_obs.txt
NavOutFile = output/20240301_nav.txt

# ---------- 解算方式 ----------
# 0 = 最小二乘浮点解，1 = 卡尔曼滤波浮点解
CalcMode = 0

# 基准站已知坐标 (WGS84 ECEF, m)
BasX = -2267808.6227
BasY =  5009324.7699
BasZ =  3221016.8928

# 零基线：流动站参考坐标与基准站相同，dX dY dZ 与 dE dN dU 都应接近 0
RovX = -2267808.6227
RovY =  5009324.7699
RovZ =  3221016.8928

# ---------- 阈值 ----------
ElevThreshold = 10
PseuThreshold = 10
RatioThreshold = 3
