# GNSS RTK 配置文件（INI 风格：key = value，# 或 ; 开头为注释）

# ---------- 数据来源 ----------
# PosMode: 0 = 二进制文件（事后），1 = 网络实时流（TCP）
PosMode = 0

# 文件模式：基准站 / 流动站二进制文件
BasBinFile = data/base.bin
RovBinFile = data/rover.bin

# 网络模式：基准站 / 流动站 IP 与端口（报告表 5 中的示例接收机可填在此处）
BasIP = 8.148.22.229
BasPort = 7002
RovIP = 8.148.22.229
RovPort = 4002

# ---------- 输出 ----------
NMEAOutputFile = output/result.nmea
OutputFile = output/result.txt

# ---------- 解算方式 ----------
# CalcMode: 0 = 最小二乘浮点解，1 = 卡尔曼滤波浮点解
CalcMode = 0

# 基准站已知坐标 (WGS84 ECEF, m)。全为 0 时使用基准站 SPP 结果
BasX = 0
BasY = 0
BasZ = 0

# 流动站参考坐标 (WGS84 ECEF, m)，只用于计算 dE/dN/dU 误差。全为 0 时使用流动站 BESTPOS
RovX = 0
RovY = 0
RovZ = 0

# ---------- 阈值 ----------
ElevThreshold = 10
PseuThreshold = 10
RatioThreshold = 3
