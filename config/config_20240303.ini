# 数据集 20240303 —— 短基线
#   采集时间：2024-03-03 上午
#   采集地点：武汉大学测绘学院院楼楼顶
#   采集设备：OEM729 板卡
#   基线类型：短基线，基线长度 5.7264 m
#
# 用法：GNSS_RTK.exe config\config_20240303.ini
# 数据文件不入库，需自行下载后放到 data\ 目录下。

# ---------- 数据来源 ----------
PosMode = 0

BasBinFile = data/20240303_base.log
RovBinFile = data/20240303_rove.log

BasIP = 8.148.22.229
BasPort = 7002
RovIP = 8.148.22.229
RovPort = 4002

# ---------- 输出 ----------
NMEAOutputFile = output/20240303.nmea
OutputFile = output/20240303.txt

# ---------- 解算方式 ----------
# 0 = 最小二乘浮点解，1 = 卡尔曼滤波浮点解
CalcMode = 0

# 基准站已知坐标 (WGS84 ECEF, m)
BasX = -2267808.6227
BasY =  5009324.7699
BasZ =  3221016.8928

# 流动站参考坐标 = 基准站 + 基线向量，只用于计算 dE/dN/dU 误差。
#
# 注意：数据说明里 XYZ 基线与 ENU 基线的符号是相反的（长度都是 5.7264 m，
# 但三个分量符号全反），只有一个是「流动站 − 基准站」。下面按 XYZ 基线
# (-1.398, 2.575, -4.920) 取值：
RovX = -2267810.0207
RovY =  5009327.3449
RovZ =  3221011.9728
#
# 若实际是按 ENU 基线 (0.211, -5.723, 0.018) 为「流动站 − 基准站」，
# 则应改用下面这组（即 XYZ 基线取反）：
#   RovX = -2267807.2247
#   RovY =  5009322.1949
#   RovZ =  3221021.8128
#
# 判别方法：看 res/RTKRes.txt 第一行的流动站坐标更接近哪一组。
# 这个选择不影响 RTK 解算结果，只影响 dE/dN/dU 这三列的参考值。

# ---------- 阈值 ----------
ElevThreshold = 10
PseuThreshold = 10
RatioThreshold = 3
